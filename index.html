.tabs,.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px}
label{display:block;font-size:.82rem;font-weight:600;color:var(--soft);margin-bottom:12px}

.pts>b{display:block;font-size:.82rem;color:var(--soft);margin-bottom:6px}
.pr{display:grid;grid-template-columns:92px 1fr 44px;gap:6px;margin-bottom:8px;align-items:start}
.pr input,.pr textarea{margin-top:0}
.pr button{padding:0}
.pts>button{margin-bottom:14px}
.pv{position:sticky;top:12px}
#pw{width:100%;max-width:460px;position:relative;overflow:hidden;border-radius:6px;border:1px solid var(--ln)}
#pi{width:1080px;height:1350px;transform-origin:0 0;position:absolute;left:0;top:0}
.note{font-size:.8rem;color:var(--soft);margin-top:10px}

</head>

</main>

$('sz').onchange=preview;
var dl=null;
async function saveOne(i){if(!dl){status('Unduhan tidak tersedia di tampilan ini');return false}
try{var b=await draw(i);await dl.save({filename:'slide-'+(i+1)+'-'+F.r.replace(':','x')+'.png',data:b});return true}catch(x){status(x&&x.code==='declined'?'Unduhan dibatalkan':'Unduhan gagal');return false}}
document.addEventListener('click',async function(ev){var b=ev.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
if(a==='png'){if(await saveOne(cur))status('Slide diunduh')}
else if(a==='all'){for(var i=0;i<S.length;i++){if(!(await saveOne(i)))break}}
else if(a==='reset'){if(confirm('Kembalikan semua slide ke isi awal? Perubahan kamu akan hilang.')){S=norm(clone(DEF));cur=0;all();save()}}
else if(a==='add'){S.splice(cur+1,0,{t:'s',tag:'',title:'Judul baru',stat:'0',label:'Keterangan angka',pts:[['Tahun','Isi poin']],close:'',src:'Sumber: '});cur++;all();save()}
else if(a==='rm'){if(S.length>1&&confirm('Hapus slide ini?')){S.splice(cur,1);cur=Math.max(0,cur-1);all();save()}}
else if(a==='up'&&cur>0){var t=S[cur];S[cur]=S[cur-1];S[cur-1]=t;cur--;all();save()}
else if(a==='down'&&cur<S.length-1){var t2=S[cur];S[cur]=S[cur+1];S[cur+1]=t2;cur++;all();save()}});
fmt();all();FP.then(preview);status('Tersimpan di browser ini');
if(window.claude&&claude.use){
claude.use('downloads').then(function(d){dl=d}).catch(function(){});
claude.use('db').then(function(db){if(!db)return;ref=db.doc('deck/content');var first=true;
ref.onSnapshot(function(snap){if(!first)return;first=false;try{var d=snap&&typeof snap.data==='function'?snap.data():snap;if(d&&d.json){var n=norm(JSON.parse(d.json));if(n){S=n;cur=0;fmt();all();save()}}status('Tersimpan')}catch(x){}},function(){})}).catch(function(){})}
</script>
</body>
</html>
